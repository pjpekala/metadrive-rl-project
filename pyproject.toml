[project]
name = "metadrive-rl-project"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "A deep reinforcement learning project to train an autonomous driving agent using the MetaDrive simulator."
dependencies = [
    "stable-baselines3[extra]>=2.0.0",
    "torch",
    "gymnasium",
    "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git",
    "setuptools==59.6.0",
    "ray[tune]>=2.54.0",
    "dm-tree",
    "ipykernel>=7.2.0",
    "gym>=0.26.2",
    "scipy",
    "lz4",
    "tensorboard",
    "numpy>=2.0",
    "imageio>=2.37.3",
    "matplotlib>=3.10.8",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]
